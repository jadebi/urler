<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>urler</title>
  <!-- CDN dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tablericons-webfont@3.45.0/dist/tabler-icons.min.css">
  <!-- Themes -->
  <link rel="stylesheet" href="css/themes/light.css" />
  <link rel="stylesheet" href="css/themes/dark.css" />
  <link rel="stylesheet" href="css/themes/emerald.css" />
  <link rel="stylesheet" href="css/base.css" />
  <!-- Scripts -->
  <script src="js/initTheme.js"></script>
  <script src="js/theme.js" defer></script>
  <script type="module" src="js/script.js"></script>
  <!-- Favicons & Icons  -->
  <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="urler" />
  <link rel="manifest" href="icons/site.webmanifest" />
</head>

<body>
  <nav class="container-fluid">
    <ul>
      <li> </li>
    </ul>
    <ul>
      <li>
        <details class="dropdown" id="theme-dropdown">
          <summary><i class="ti ti-device-desktop"></i> Auto</summary>
          <ul>
            <li><a data-theme-option="auto"><i class="ti ti-device-desktop"></i> Auto</a></li>
            <li><a data-theme-option="light"><i class="ti ti-sun"></i> Light</a></li>
            <li><a data-theme-option="dark"><i class="ti ti-moon"></i> Dark</a></li>
            <li><a data-theme-option="emerald"><i class="ti ti-diamond"></i> Emerald</a></li>
          </ul>
        </details>
      </li>
    </ul>
  </nav>

  <main class="container">
    <section>
      <h2><img src="icons/logo.svg" alt="urler logo" class="ti-img"> urler</h2>
      <p>
        Enter a URL to shorten
      </p>
      <p>
        If you want the META Tags of another URL, enable the Advanced Mode.
      </p>
    </section>
    <form id="form">
      <label for="advanced-toggle">
        <input type="checkbox" id="advanced-toggle" class="outline">
        Advanced
      </label>
      <fieldset>
        <fieldset role="group" id="response-status">
          <input type="text" name="url" placeholder="URL to shorten" aria-label="url" required>
          <input class="outline" type="submit" id="submit" value="Short!" disabled>
        </fieldset>
        <small class="url-error" id="url-error" style="display: none;"></small>
        <input type="text" name="meta-url" placeholder="URL for META tags" aria-label="meta-url">
        <small class="url-error" id="meta-url-error" style="display: none;"></small>
      </fieldset>
    </form>
  </main>
</body>

</html>
